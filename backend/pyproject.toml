[project]
name = "react-vue-migrator-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "langchain-openai>=0.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
